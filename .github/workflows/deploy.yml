name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out on the VM over SSH
        if: ${{ vars.VM_HOST != '' }}
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAMILY_PASSCODE: ${{ secrets.FAMILY_PASSCODE }}
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GEMINI_API_KEY,FAMILY_PASSCODE,DOMAIN
          script: |
            # First deploy bootstraps the VM (installs Docker, writes .env from repo secrets); later runs just update.
            if [ ! -f /opt/math-sprout/docker-compose.yml ]; then
              curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/vm/install.sh | bash
            else
              /opt/math-sprout/update.sh
            fi
      - if: ${{ vars.VM_HOST == '' }}
        run: echo "VM_HOST not configured; skipping deploy (image is published to GHCR)."
